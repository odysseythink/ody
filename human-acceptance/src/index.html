<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ody 人工验收</title>

body{font:16px system-ui;background:#f5f6fa;color:#202639;margin:0}header{padding:24px;background:#202639;color:white}main{max-width:1100px;margin:24px auto;display:grid;grid-template-columns:260px 1fr;gap:24px;padding:0 16px}nav,article{background:white;border-radius:12px;padding:20px}button,select,textarea{font:inherit}button{cursor:pointer;padding:10px 14px;margin:6px 4px 6px 0}nav button{display:block;width:100%;text-align:left}textarea{display:block;box-sizing:border-box;width:100%;min-height:90px;margin:8px 0 16px}label{display:block;margin-top:16px}li{padding:10px 0;white-space:pre-wrap}p{white-space:pre-wrap}#message{max-width:1100px;margin:12px auto;padding:0 16px}button[aria-current=true]{background:#dbeafe}small{color:#596174}@media(max-width:700px){main{grid-template-columns:1fr}}
