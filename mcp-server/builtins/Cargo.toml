[package]
name = "ody-builtin-mcp"
description = "Rust implementations of the odyBox builtin MCP servers (fetch, sequentialthinking, arxiv, context7)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ody-builtin-mcp"
path = "src/main.rs"

[lib]
name = "ody_builtin_mcp"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
fast_html2md = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = [
    "macros",
    "schemars",
    "server",
    "transport-async-rw",
    "transport-io",
] }
schemars = "1.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The `client` feature is only needed for the in-process duplex transport
# tests in lib.rs (the production binary only serves servers).
rmcp = { workspace = true, features = [
    "client",
    "macros",
    "schemars",
    "server",
    "transport-async-rw",
    "transport-io",
] }
