[package]
name = "ody-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ody_remote"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "ody-remote-gateway"
path = "src/bin/ody-remote-gateway.rs"

[[bin]]
name = "ody-remote-agent"
path = "src/bin/ody-remote-agent.rs"
required-features = ["agent"]

[features]
default = ["agent"]
# The agent bridges local ody app-servers and needs the heavy client stack;
# the gateway (built on the VPS) is intentionally light.
agent = [
    "dep:ody-app-server-client",
    "dep:ody-app-server-protocol",
    "dep:ody-utils-absolute-path",
    "dep:ody-utils-rustls-provider",
    "dep:rustls",
    "dep:rustls-native-certs",
]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
http = { workspace = true }
ody-app-server-client = { workspace = true, optional = true }
ody-app-server-protocol = { workspace = true, optional = true }
ody-utils-absolute-path = { workspace = true, optional = true }
ody-utils-rustls-provider = { workspace = true, optional = true }
rand = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }
tokio-rustls = { workspace = true }
