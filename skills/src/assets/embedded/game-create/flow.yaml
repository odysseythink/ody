name: game-create
description: 从一句话主题到可运行 Web 游戏原型的多阶段流程：概念收敛 → GDD → 技术选型 → 按机制并行实现 → 试玩验证
phases:
  - id: concept
    steps:
      - agent: |
          你是游戏策划。把主题「${{ args.text }}」收敛成一个 30 秒内可验证的最小 Web 游戏概念：
          一句话玩法、单一核心乐趣、一种主要输入、明确的胜负或结束条件。
          主题过大就砍到最小可玩闭环；拒绝空泛设定。
        output: concept
        schema:
          type: object
          required: [pitch, coreLoop, input, winLose, fun]
          properties:
            pitch: { type: string }
            coreLoop: { type: string }
            input: { type: string }
            winLose: { type: string }
            fun: { type: string }

  - id: gdd
    steps:
      - agent: |
          基于概念生成游戏设计文档（GDD），JSON 输出。
          概念：${{ concept.pitch }}
          核心循环：${{ concept.coreLoop }}；输入：${{ concept.input }}
          胜负：${{ concept.winLose }}；乐趣点：${{ concept.fun }}
          要求：
          - mechanics 拆成 3-5 个可独立实现、可独立验证的机制，每项含 name 与 spec
            （spec 写明行为、参数、与其他机制的关系）
          - constraints 为技术约束：单文件优先、无外部素材、Web 平台、60fps 性能预算
          - feedback 列出每个玩家操作对应的视听反馈（命中、得分、失败、连击等）
        output: gdd
        schema:
          type: object
          required: [mechanics, constraints, feedback]
          properties:
            mechanics:
              type: array
              items:
                type: object
                required: [name, spec]
                properties:
                  name: { type: string }
                  spec: { type: string }
            constraints:
              type: array
              items: { type: string }
            feedback:
              type: array
              items: { type: string }

  - id: tech-select
    steps:
      - agent: |
          依据约束 ${{ gdd.constraints }} 为游戏选择 Web 技术方案，JSON 输出：
          - stack：一句话方案加理由。选择规则：UI 轻量/文字/卡片类 → 纯 DOM+CSS；
            精灵/碰撞/粒子/大量运动对象 → Canvas 2D；瓦片地图/关卡/平台物理 → Phaser 3；
            真 3D → Three.js。原型默认选最简单的可行项。
          - files：文件清单（默认单 index.html，复杂时拆 main.js / style.css）
          - run：本地运行方式（如 python3 -m http.server 或 npx serve）
          完整决策表见 game-create 技能的 references/tech-selection.md
          （系统技能目录内，可用文件读取工具查看）。
        output: plan
        schema:
          type: object
          required: [stack, files, run]
          properties:
            stack: { type: string }
            files:
              type: array
              items: { type: string }
            run: { type: string }

  - id: implement
    steps:
      - pipeline: ${{ gdd.mechanics }}
        each: |
          实现游戏机制「${item.name}」：${item.spec}
          技术方案：${{ plan.stack }}；文件：${{ plan.files }}；约束：${{ gdd.constraints }}
          玩家反馈要求：${{ gdd.feedback }}
          动效与手感规范（必须遵守；细节用 skills.list 找到 motion-design 包后 skills.read 读取其 SKILL.md）：
          - 入场/出场 ease-out：cubic-bezier(0.23,1,0.32,1)；UI 动效 ≤300ms
          - 入场起始 scale(0.92)+opacity 0，禁止 scale(0)
          - 高频操作（每帧移动、连续输入）零装饰动画；按下即响应（100ms 内反馈）
          - 命中反馈：缩放脉冲 scale(0.95)→1 用 120ms；弹簧 {type:"spring",duration:0.5,bounce:0}，
            仅投掷/拖拽类交互可用 bounce 0.2；预设见 game-create 技能 references/motion-presets.md
          输出实现摘要：改了哪些文件、该机制如何手动验证。
        output: implementations

  - id: playtest
    steps:
      - parallel:
          - agent: |
              试玩验证。按 ${{ plan.run }} 启动本地静态服务，用 browser-control 工具：
              navigate 打开游戏（loopback 自动豁免审批）、screenshot 检查渲染、evaluate 模拟按键/点击。
              逐项检查：画面渲染正常、控制台无报错、输入有响应、胜负路径可达、无肉眼卡顿。
              若 browser-control 不可用，改为静态审查并在结论中说明如何手动验证。
              输出：阻塞性问题清单（无问题则明确写"通过"）。
          - agent: |
              代码审查 ${{ implementations }}：
              - 边界情况：极值输入、连续快速操作、同时多键
              - 对照反馈要求 ${{ gdd.feedback }}：每个玩家操作是否都有对应视听反馈
              - 约束符合度 ${{ gdd.constraints }}：单文件、无外部素材、仅 transform/opacity 动画
              输出：按严重度排序的问题清单。
        output: review
