[package]
edition.workspace = true
license.workspace = true
name = "ody-mcp"
version.workspace = true

[lib]
name = "ody_mcp"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
# Bundles the Rust builtin MCP servers (fetch, sequentialthinking, arxiv,
# context7) into the host binary and serves them in-process over tokio
# duplex streams instead of spawning the `ody-builtin-mcp` helper binary.
# Off by default so local dev builds stay lean; release/packaging builds
# that distribute a single ody binary should enable this.
bundled-builtin-mcp = ["dep:ody-builtin-mcp"]

[dependencies]
ody-builtin-mcp = { workspace = true, optional = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
ody-async-utils = { workspace = true }
ody-api = { workspace = true }
ody-config = { workspace = true }
ody-exec-server = { workspace = true }
ody-model-provider = { workspace = true }
ody-otel = { workspace = true }
ody-plugin = { workspace = true }
ody-protocol = { workspace = true }
ody-rmcp-client = { workspace = true }
ody-utils-path-uri = { workspace = true }
ody-utils-plugins = { workspace = true }
futures = { workspace = true }
regex-lite = { workspace = true }
rmcp = { workspace = true, default-features = false, features = ["base64", "macros", "schemars", "server"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
rmcp = { workspace = true, default-features = false, features = ["base64", "client", "macros", "schemars", "server"] }
tempfile = { workspace = true }
